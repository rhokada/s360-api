<div class="max-w-7xl mx-auto">

  <!-- Saudação -->
  <div class="mb-8">
    <h1 class="text-2xl font-bold text-gray-800">
      {{ getGreeting() }}, {{ firstName() }}!
    </h1>
    <p class="text-gray-500 mt-1">Aqui está um resumo.</p>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="flex items-center justify-center py-16">
    <div class="spinner w-8 h-8"></div>
  </div>

  <!-- Erro -->
  <div *ngIf="!loading && errorMessage" class="p-4 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
    {{ errorMessage }}
  </div>

  <!-- Cards de indicadores -->
  <div *ngIf="!loading && !errorMessage" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <div *ngFor="let card of cards" class="card flex flex-col gap-1">
      <p class="text-xs text-gray-500 font-medium uppercase tracking-wide leading-tight">{{ card.Label }}</p>
      <p class="text-2xl font-bold text-gray-800 mt-1">{{ card.valor ?? '—' }}</p>
    </div>
  </div>

</div>
