<div class="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Logo / Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-primary-500 rounded-xl shadow-lg mb-4">
        <span class="text-white font-bold text-lg">S360</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Supervision 360</h1>
      <p class="text-gray-500 text-sm mt-1">Olá, <span class="font-medium text-gray-700">{{ userName }}</span></p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-1">Selecione seu perfil de acesso</h2>
      <p class="text-sm text-gray-500 mb-6">Você possui mais de um perfil. Escolha com qual deseja continuar.</p>

      <div class="space-y-3">
        <button
          *ngFor="let role of roles"
          type="button"
          (click)="selectRole(role)"
          class="w-full flex items-center gap-4 p-4 rounded-xl border-2 border-gray-100 hover:border-primary-400 hover:bg-primary-50 transition-all duration-200 group text-left"
        >
          <div class="w-10 h-10 rounded-lg bg-primary-100 group-hover:bg-primary-200 flex items-center justify-center flex-shrink-0 transition-colors">
            <span class="text-primary-600 font-bold text-sm">{{ role.admRoleCd }}</span>
          </div>
          <div class="flex-1">
            <p class="font-semibold text-gray-800 text-sm">{{ role.admRoleName }}</p>
            <p class="text-xs text-gray-400 mt-0.5">{{ role.rolePermissions.length }} permissão(ões) configurada(s)</p>
          </div>
          <svg class="w-5 h-5 text-gray-300 group-hover:text-primary-500 transition-colors flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>

      <div class="mt-6 pt-4 border-t border-gray-100">
        <button
          type="button"
          (click)="logout()"
          class="w-full text-sm text-gray-400 hover:text-red-500 transition-colors py-2"
        >
          Sair da conta
        </button>
      </div>
    </div>
  </div>
</div>
