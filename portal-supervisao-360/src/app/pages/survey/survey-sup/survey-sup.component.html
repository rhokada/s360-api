<div class="p-6">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-bold text-gray-800">Supervisores do Survey</h2>
    <button (click)="fechar.emit()"
      class="text-gray-500 hover:text-gray-700 hover:bg-gray-100 p-2 rounded-lg transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <div *ngIf="errorMessage" class="mb-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">
    {{ errorMessage }}
  </div>
  <div *ngIf="successMessage" class="mb-4 p-4 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm">
    {{ successMessage }}
  </div>

  <!-- Formulário de criação -->
  <div class="bg-gray-50 rounded-lg p-4 mb-6">
    <h3 class="text-sm font-semibold text-gray-700 mb-3">Adicionar Supervisor</h3>
    <form [formGroup]="createForm" (ngSubmit)="onCreate()" class="flex flex-wrap gap-3 items-end">
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-gray-600">ID do Usuário</label>
        <input formControlName="supUserId" type="number" placeholder="ID"
          class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 w-28" />
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-gray-600">Nome</label>
        <input formControlName="name" type="text" placeholder="Nome"
          class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 w-48" />
      </div>
      <button type="submit" [disabled]="createForm.invalid"
        class="bg-primary-500 hover:bg-primary-600 disabled:opacity-50 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
        Adicionar
      </button>
    </form>
  </div>

  <!-- Tabela -->
  <div *ngIf="loading" class="text-center py-4 text-gray-500 text-sm">Carregando...</div>
  <table *ngIf="!loading" class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID Usuário</th>
        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nome</th>
        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Ações</th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
      <tr *ngFor="let item of items" class="hover:bg-gray-50">
        <td class="px-4 py-3 text-sm text-gray-700">{{ item.surveySupId }}</td>
        <td class="px-4 py-3 text-sm text-gray-700">
          <span *ngIf="!isEditing(item.surveySupId)">{{ item.supUserId }}</span>
          <input *ngIf="isEditing(item.surveySupId)"
            [(ngModel)]="getEdit(item.surveySupId).supUserId"
            [ngModelOptions]="{standalone: true}"
            type="number"
            class="border border-gray-300 rounded-lg px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 w-24" />
        </td>
        <td class="px-4 py-3 text-sm text-gray-700">
          <span *ngIf="!isEditing(item.surveySupId)">{{ item.name }}</span>
          <input *ngIf="isEditing(item.surveySupId)"
            [(ngModel)]="getEdit(item.surveySupId).name"
            [ngModelOptions]="{standalone: true}"
            class="border border-gray-300 rounded-lg px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 w-40" />
        </td>
        <td class="px-4 py-3">
          <div class="flex items-center gap-2">
            <ng-container *ngIf="!isEditing(item.surveySupId)">
              <button (click)="startEdit(item)"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg border border-blue-200 text-blue-700 bg-blue-50 hover:bg-blue-100 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
                Editar
              </button>
              <button (click)="onDelete(item.surveySupId)"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg border border-red-200 text-red-700 bg-red-50 hover:bg-red-100 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
                Excluir
              </button>
            </ng-container>
            <ng-container *ngIf="isEditing(item.surveySupId)">
              <button (click)="onUpdate(item.surveySupId)"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg border border-green-200 text-green-700 bg-green-50 hover:bg-green-100 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                Salvar
              </button>
              <button (click)="cancelEdit(item.surveySupId)"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg border border-gray-200 text-gray-600 bg-gray-50 hover:bg-gray-100 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
                Cancelar
              </button>
            </ng-container>
          </div>
        </td>
      </tr>
      <tr *ngIf="items.length === 0">
        <td colspan="4" class="px-4 py-8 text-center text-gray-400 text-sm">Nenhum supervisor cadastrado.</td>
      </tr>
    </tbody>
  </table>
</div>
