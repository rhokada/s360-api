<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
  <!-- Breadcrumb -->
  <nav class="flex items-center gap-1.5 text-sm mb-5 flex-wrap">
    <a routerLink="/adm/company" class="text-indigo-600 hover:text-indigo-800 font-medium">Empresas</a>
    <span class="text-gray-400">›</span>
    <a [routerLink]="['/adm/company', companyId, 'dept']" class="text-indigo-600 hover:text-indigo-800">{{ company?.name || '...' }}</a>
    <span class="text-gray-400">›</span>
    <span class="text-gray-600">{{ dept?.name || '...' }}</span>
    <span class="text-gray-400">›</span>
    <span class="text-gray-900 font-medium">Funcionários</span>
  </nav>

  <!-- Cabeçalho -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <div>
      <h1 class="text-xl font-semibold text-gray-900">Funcionários</h1>
      <p class="text-sm text-gray-500 mt-0.5">{{ dept?.name }} — {{ company?.name }}</p>
    </div>
    <button
      type="button"
      class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors"
      (click)="openCreate()"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Adicionar Funcionário
    </button>
  </div>

  <!-- Skeleton -->
  <ng-container *ngIf="isLoading">
    <div *ngFor="let _ of [1,2,3,4,5]" class="h-10 bg-gray-100 rounded animate-pulse mb-2"></div>
  </ng-container>

  <!-- Tabela -->
  <div *ngIf="!isLoading" class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-gray-100">
          <th class="text-left py-3 px-3 font-medium text-gray-500">Nome</th>
          <th class="text-left py-3 px-3 font-medium text-gray-500">E-mail</th>
          <th class="text-left py-3 px-3 font-medium text-gray-500">Cargo</th>
          <th class="text-left py-3 px-3 font-medium text-gray-500">Código</th>
          <th class="py-3 px-3"></th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let du of deptUsers"
          class="border-b border-gray-50 hover:bg-gray-50 cursor-pointer transition-colors"
          (click)="openEdit(du)"
        >
          <td class="py-3 px-3 font-medium text-gray-800">{{ du.userName }}</td>
          <td class="py-3 px-3 text-gray-600">{{ du.userEmail }}</td>
          <td class="py-3 px-3 text-gray-600">{{ du.title || '—' }}</td>
          <td class="py-3 px-3 text-gray-600">{{ du.companyCodeUser || '—' }}</td>
          <td class="py-3 px-3 text-right">
            <button
              type="button"
              class="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors"
              (click)="confirmDelete(du.deptUserId, $event)"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
          </td>
        </tr>
        <tr *ngIf="deptUsers.length === 0">
          <td colspan="5" class="py-10 text-center text-gray-400 text-sm">Nenhum funcionário encontrado.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- SidePanel -->
<app-side-panel [title]="panelTitle" [visible]="panelVisible" (closed)="closePanel()">
  <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-4">
    <!-- Autocomplete de usuário -->
    <div class="relative">
      <label class="block text-xs font-medium text-gray-600 mb-1">Usuário *</label>
      <input
        type="text"
        [value]="selectedUserName"
        (input)="onUserInput($event)"
        (blur)="closeDropdown()"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
        placeholder="Digite o nome para buscar..."
        [class.border-red-300]="form.get('userId')?.invalid && form.get('userId')?.touched"
      />
      <!-- Dropdown de sugestões -->
      <div
        *ngIf="showUserDropdown"
        class="absolute top-full left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg z-10 max-h-48 overflow-y-auto"
      >
        <button
          *ngFor="let user of userSearchResults"
          type="button"
          class="w-full text-left px-3 py-2 text-sm hover:bg-indigo-50 hover:text-indigo-700 transition-colors"
          (mousedown)="selectUser(user)"
        >
          <div class="font-medium">{{ user.name }}</div>
          <div class="text-xs text-gray-500">{{ user.email }}</div>
        </button>
      </div>
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Cargo</label>
      <input
        formControlName="title"
        type="text"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
        placeholder="Ex: Analista, Gerente..."
      />
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Código</label>
      <input
        formControlName="companyCodeUser"
        type="text"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
        placeholder="Código do colaborador"
      />
    </div>
    <div class="pt-2">
      <button
        type="submit"
        class="w-full py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="form.invalid || isSaving"
      >
        {{ isSaving ? 'Salvando...' : (isEditing ? 'Atualizar' : 'Adicionar') }}
      </button>
    </div>
  </form>
</app-side-panel>

<!-- Confirm Dialog -->
<app-confirm-dialog
  *ngIf="showConfirm"
  message="Tem certeza que deseja remover este funcionário do departamento?"
  (confirmed)="onDeleteConfirmed()"
  (cancelled)="onDeleteCancelled()"
></app-confirm-dialog>
