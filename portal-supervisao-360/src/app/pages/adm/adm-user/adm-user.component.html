<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
  <!-- Cabeçalho -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <div>
      <h1 class="text-xl font-semibold text-gray-900">Usuários</h1>
      <p class="text-sm text-gray-500 mt-0.5">Gerencie os usuários do sistema</p>
    </div>
    <button
      type="button"
      class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors"
      (click)="openCreate()"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Novo Usuário
    </button>
  </div>

  <!-- Filtros -->
  <form [formGroup]="filterForm" class="flex flex-col sm:flex-row gap-3 mb-5">
    <input
      formControlName="name"
      type="text"
      placeholder="Filtrar por nome..."
      class="flex-1 px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
    />
    <input
      formControlName="email"
      type="text"
      placeholder="Filtrar por e-mail..."
      class="flex-1 px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
    />
    <select
      formControlName="active"
      class="w-full sm:w-40 px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white"
    >
      <option value="">Todos</option>
      <option value="true">Ativo</option>
      <option value="false">Inativo</option>
    </select>
  </form>

  <!-- Skeleton -->
  <ng-container *ngIf="isLoading">
    <div *ngFor="let _ of [1,2,3,4,5]" class="h-10 bg-gray-100 rounded animate-pulse mb-2"></div>
  </ng-container>

  <!-- Tabela -->
  <div *ngIf="!isLoading" class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-gray-100">
          <th class="text-left py-3 px-3 font-medium text-gray-500">Nome</th>
          <th class="text-left py-3 px-3 font-medium text-gray-500">E-mail</th>
          <th class="text-left py-3 px-3 font-medium text-gray-500">Status</th>
          <th class="text-left py-3 px-3 font-medium text-gray-500">Celular</th>
          <th class="text-left py-3 px-3 font-medium text-gray-500">Cargo</th>
          <th class="text-left py-3 px-3 font-medium text-gray-500">Código</th>
          <th class="py-3 px-3"></th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let user of users"
          class="border-b border-gray-50 hover:bg-gray-50 transition-colors"
        >
          <td class="py-3 px-3 font-medium text-gray-800">{{ user.name }}</td>
          <td class="py-3 px-3 text-gray-600">{{ user.email }}</td>
          <td class="py-3 px-3">
            <span
              class="px-2 py-0.5 rounded-full text-xs font-medium"
              [ngClass]="{'bg-green-100 text-green-700': user.active, 'bg-gray-100 text-gray-500': !user.active}"
            >
              {{ user.active ? 'Ativo' : 'Inativo' }}
            </span>
          </td>
          <td class="py-3 px-3 text-gray-600">{{ formatPhone(user.dddCell, user.nrCell) }}</td>
          <td class="py-3 px-3 text-gray-600">{{ user.title || '—' }}</td>
          <td class="py-3 px-3 text-gray-600">{{ user.companyCodeUser || '—' }}</td>
          <td class="py-3 px-3 text-right">
            <div class="flex items-center justify-end gap-1">
              <button
                type="button"
                class="p-1.5 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors"
                (click)="openEdit(user)"
                title="Editar"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
              </button>
              <button
                type="button"
                class="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors"
                (click)="confirmDelete(user.userId, $event)"
                title="Excluir"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="users.length === 0">
          <td colspan="7" class="py-10 text-center text-gray-400 text-sm">Nenhum usuário encontrado.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- SidePanel -->
<app-side-panel [title]="panelTitle" [visible]="panelVisible" (closed)="closePanel()">
  <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-4">
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Nome *</label>
      <input
        formControlName="name"
        type="text"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
      />
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">E-mail *</label>
      <input
        formControlName="email"
        type="email"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
      />
    </div>
    <div class="flex gap-3">
      <div class="w-28">
        <label class="block text-xs font-medium text-gray-600 mb-1">DDD</label>
        <input
          formControlName="dddCell"
          type="text"
          maxlength="2"
          class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
          placeholder="11"
        />
      </div>
      <div class="flex-1">
        <label class="block text-xs font-medium text-gray-600 mb-1">Celular</label>
        <input
          formControlName="nrCell"
          type="text"
          class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
          placeholder="99999-9999"
        />
      </div>
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">App ID</label>
      <input
        formControlName="appId"
        type="text"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
      />
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">PBI Login</label>
      <input
        formControlName="pbiLogin"
        type="text"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
      />
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Contract ID</label>
      <input
        formControlName="contractId"
        type="number"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
      />
    </div>
    <div class="flex items-center gap-3 pt-1">
      <label class="relative inline-flex items-center cursor-pointer">
        <input
          formControlName="active"
          type="checkbox"
          class="sr-only peer"
        />
        <div class="w-10 h-5 bg-gray-200 rounded-full peer peer-checked:bg-indigo-600 peer-focus:ring-2 peer-focus:ring-indigo-300 transition-colors after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-transform peer-checked:after:translate-x-5"></div>
      </label>
      <span class="text-sm text-gray-600">Usuário ativo</span>
    </div>
    <div class="pt-2">
      <button
        type="submit"
        class="w-full py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="form.invalid || isSaving"
      >
        {{ isSaving ? 'Salvando...' : (isEditing ? 'Atualizar' : 'Criar') }}
      </button>
    </div>
  </form>
</app-side-panel>

<!-- Confirm Dialog -->
<app-confirm-dialog
  *ngIf="showConfirm"
  message="Tem certeza que deseja excluir este usuário?"
  (confirmed)="onDeleteConfirmed()"
  (cancelled)="onDeleteCancelled()"
></app-confirm-dialog>
