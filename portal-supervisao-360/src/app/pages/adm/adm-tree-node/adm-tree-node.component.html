<div class="mb-3">
  <!-- Card do nó -->
  <div class="border-l-4 border-indigo-400 bg-white rounded-xl shadow-sm border border-gray-100 p-4">
    <!-- Header do chefe -->
    <div class="flex items-start justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="flex-shrink-0 w-9 h-9 rounded-full bg-indigo-100 flex items-center justify-center">
          <span class="text-sm font-semibold text-indigo-700">{{ node.name.charAt(0).toUpperCase() }}</span>
        </div>
        <div class="min-w-0">
          <p class="text-sm font-semibold text-gray-900 truncate">{{ node.name }}</p>
          <p class="text-xs text-gray-500 truncate">{{ node.email }}</p>
          <div class="flex items-center gap-2 mt-0.5">
            <span *ngIf="node.title" class="text-xs text-indigo-600">{{ node.title }}</span>
            <span *ngIf="node.companyName" class="text-xs text-gray-400">{{ node.companyName }}</span>
            <span *ngIf="node.deptName" class="text-xs text-gray-400">— {{ node.deptName }}</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-1 flex-shrink-0">
        <button
          type="button"
          class="px-2 py-1 text-xs text-indigo-600 bg-indigo-50 rounded-lg hover:bg-indigo-100 transition-colors font-medium"
          (click)="onAddMember()"
        >
          + Membro
        </button>
        <button
          type="button"
          *ngIf="node.children.length > 0 || node.members.length > 0"
          class="p-1 text-gray-400 hover:text-gray-600 rounded transition-colors"
          (click)="toggleExpand()"
        >
          <svg
            class="w-4 h-4 transition-transform"
            [class.rotate-180]="!expanded"
            fill="none" stroke="currentColor" viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Membros diretos -->
    <div *ngIf="expanded && node.members.length > 0" class="mt-3 pt-3 border-t border-gray-100">
      <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-2">Membros</p>
      <div class="flex flex-wrap gap-2">
        <div
          *ngFor="let member of node.members"
          class="inline-flex items-center gap-1.5 bg-gray-50 border border-gray-200 rounded-lg px-2 py-1 group"
        >
          <span class="text-xs text-gray-700 font-medium">{{ member.userName }}</span>
          <span *ngIf="member.title" class="text-xs text-gray-400">· {{ member.title }}</span>
          <div class="hidden group-hover:flex items-center gap-0.5 ml-1">
            <button
              type="button"
              class="p-0.5 text-indigo-400 hover:text-indigo-600 rounded transition-colors"
              (click)="onEditMember(member)"
              title="Editar"
            >
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
              </svg>
            </button>
            <button
              type="button"
              class="p-0.5 text-red-400 hover:text-red-600 rounded transition-colors"
              (click)="onDeleteMember(member)"
              title="Remover"
            >
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Filhos recursivos -->
  <div *ngIf="expanded && node.children.length > 0" class="ml-6 mt-2 pl-4 border-l-2 border-gray-200">
    <app-adm-tree-node
      *ngFor="let child of node.children"
      [node]="child"
      [hierarchyId]="hierarchyId"
      (addMember)="onChildAdd($event)"
      (editMember)="onChildEdit($event)"
      (deleteMember)="onChildDelete($event)"
    ></app-adm-tree-node>
  </div>
</div>
