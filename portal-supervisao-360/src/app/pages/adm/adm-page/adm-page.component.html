<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
  <!-- Cabeçalho -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <div>
      <h1 class="text-xl font-semibold text-gray-900">Páginas do Sistema</h1>
      <p class="text-sm text-gray-500 mt-0.5">Gerencie as páginas e seus slugs de permissão</p>
    </div>
    <button
      type="button"
      class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors"
      (click)="openCreate()"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Nova Página
    </button>
  </div>

  <!-- Filtro -->
  <form [formGroup]="filterForm" class="mb-5">
    <input
      formControlName="search"
      type="text"
      placeholder="Filtrar por slug ou menu..."
      class="w-full sm:w-80 px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
    />
  </form>

  <!-- Skeleton -->
  <ng-container *ngIf="isLoading">
    <div *ngFor="let _ of [1,2,3,4]" class="h-10 bg-gray-100 rounded animate-pulse mb-2"></div>
  </ng-container>

  <!-- Tabela -->
  <div *ngIf="!isLoading" class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-gray-100">
          <th class="text-left py-3 px-3 font-medium text-gray-500">Slug</th>
          <th class="text-left py-3 px-3 font-medium text-gray-500">Menu</th>
          <th class="text-left py-3 px-3 font-medium text-gray-500">Ícone</th>
          <th class="py-3 px-3"></th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let page of pages"
          class="border-b border-gray-50 hover:bg-gray-50 cursor-pointer transition-colors"
          (click)="openEdit(page)"
        >
          <td class="py-3 px-3 text-gray-500 font-mono text-xs">{{ page.slug }}</td>
          <td class="py-3 px-3 font-medium text-gray-800">{{ page.menu }}</td>
          <td class="py-3 px-3 text-gray-500 text-xs">{{ page.icon || '—' }}</td>
          <td class="py-3 px-3 text-right">
            <button
              type="button"
              title="Excluir página"
              class="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors"
              (click)="confirmDelete(page.admPageId, $event)"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
          </td>
        </tr>
        <tr *ngIf="pages.length === 0">
          <td colspan="4" class="py-10 text-center text-gray-400 text-sm">Nenhuma página encontrada.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- SidePanel -->
<app-side-panel [title]="panelTitle" [visible]="panelVisible" (closed)="closePanel()">
  <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-4">
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Slug *</label>
      <input formControlName="slug" type="text"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
        placeholder="ex: adm-page"/>
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Menu *</label>
      <input formControlName="menu" type="text"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
        placeholder="ex: Páginas do Sistema"/>
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Ícone</label>
      <input formControlName="icon" type="text"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
        placeholder="ex: settings"/>
    </div>
    <div class="pt-2">
      <button type="submit"
        class="w-full py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="form.invalid || isSaving">
        {{ isSaving ? 'Salvando...' : (isEditing ? 'Atualizar' : 'Criar') }}
      </button>
    </div>
  </form>
</app-side-panel>

<!-- Confirm Dialog -->
<app-confirm-dialog
  *ngIf="showConfirm"
  message="Tem certeza que deseja excluir esta página?"
  (confirmed)="onDeleteConfirmed()"
  (cancelled)="onDeleteCancelled()"
></app-confirm-dialog>
