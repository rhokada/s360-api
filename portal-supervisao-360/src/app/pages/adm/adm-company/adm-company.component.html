<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
  <!-- Cabeçalho -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <div>
      <h1 class="text-xl font-semibold text-gray-900">Empresas</h1>
      <p class="text-sm text-gray-500 mt-0.5">Gerencie as empresas do sistema</p>
    </div>
    <button
      type="button"
      class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors"
      (click)="openCreate()"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Nova Empresa
    </button>
  </div>

  <!-- Filtros -->
  <form [formGroup]="filterForm" class="flex flex-col sm:flex-row gap-3 mb-5">
    <input
      formControlName="name"
      type="text"
      placeholder="Filtrar por nome..."
      class="flex-1 px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
    />
    <input
      formControlName="taxID"
      type="text"
      placeholder="Filtrar por CNPJ..."
      class="w-full sm:w-56 px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
    />
  </form>

  <!-- Skeleton -->
  <ng-container *ngIf="isLoading">
    <div *ngFor="let _ of [1,2,3,4,5]" class="h-10 bg-gray-100 rounded animate-pulse mb-2"></div>
  </ng-container>

  <!-- Tabela -->
  <div *ngIf="!isLoading" class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-gray-100">
          <th class="text-left py-3 px-3 font-medium text-gray-500">Nome</th>
          <th class="text-left py-3 px-3 font-medium text-gray-500">CNPJ</th>
          <th class="text-left py-3 px-3 font-medium text-gray-500">Cidade / Estado</th>
          <th class="text-left py-3 px-3 font-medium text-gray-500">Empresa Pai</th>
          <th class="py-3 px-3"></th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let company of companies"
          class="border-b border-gray-50 hover:bg-gray-50 cursor-pointer transition-colors"
          (click)="openEdit(company)"
        >
          <td class="py-3 px-3 font-medium text-gray-800">{{ company.name }}</td>
          <td class="py-3 px-3 text-gray-600">{{ company.taxID || '—' }}</td>
          <td class="py-3 px-3 text-gray-600">
            {{ company.city || '—' }}
            <span *ngIf="company.state"> / {{ company.state }}</span>
          </td>
          <td class="py-3 px-3 text-gray-600">{{ getParentName(company.parentCompanyId) }}</td>
          <td class="py-3 px-3">
            <div class="flex items-center justify-end gap-2">
              <button
                type="button"
                class="px-3 py-1 text-xs font-medium text-indigo-700 bg-indigo-50 rounded-lg hover:bg-indigo-100 transition-colors"
                (click)="goToDepts(company.companyId, $event)"
              >
                Depts
              </button>
              <button
                type="button"
                class="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors"
                (click)="confirmDelete(company.companyId, $event)"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="companies.length === 0">
          <td colspan="5" class="py-10 text-center text-gray-400 text-sm">Nenhuma empresa encontrada.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- SidePanel -->
<app-side-panel [title]="panelTitle" [visible]="panelVisible" (closed)="closePanel()">
  <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-4">
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Nome *</label>
      <input
        formControlName="name"
        type="text"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
        placeholder="Nome da empresa"
      />
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">CNPJ</label>
      <input
        formControlName="taxID"
        type="text"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
        placeholder="00.000.000/0000-00"
      />
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Logo URL</label>
      <input
        formControlName="logoUrl"
        type="text"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
        placeholder="https://..."
      />
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Empresa Pai</label>
      <select
        formControlName="parentCompanyId"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white"
      >
        <option [ngValue]="null">Nenhuma</option>
        <option *ngFor="let c of allCompanies" [ngValue]="c.companyId">{{ c.name }}</option>
      </select>
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Address ID</label>
      <input
        formControlName="addressId"
        type="number"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300"
        placeholder="ID do endereço"
      />
    </div>
    <div class="pt-2">
      <button
        type="submit"
        class="w-full py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="form.invalid || isSaving"
      >
        {{ isSaving ? 'Salvando...' : (isEditing ? 'Atualizar' : 'Criar') }}
      </button>
    </div>
  </form>
</app-side-panel>

<!-- Confirm Dialog -->
<app-confirm-dialog
  *ngIf="showConfirm"
  message="Tem certeza que deseja excluir esta empresa? Esta ação não pode ser desfeita."
  (confirmed)="onDeleteConfirmed()"
  (cancelled)="onDeleteCancelled()"
></app-confirm-dialog>
