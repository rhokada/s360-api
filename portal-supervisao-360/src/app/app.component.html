<div class="min-h-screen bg-gray-50">
  <!-- Layout de Login (sem sidebar/header) -->
  <ng-container *ngIf="isLoginPage">
    <router-outlet></router-outlet>
  </ng-container>

  <!-- Layout Principal (com sidebar e header) -->
  <ng-container *ngIf="!isLoginPage">
    <!-- Overlay mobile -->
    <div
      *ngIf="sidebarOpen"
      class="fixed inset-0 bg-black bg-opacity-50 z-20 lg:hidden"
      (click)="closeSidebar()"
    ></div>

    <!-- Sidebar -->
    <app-sidebar
      [isOpen]="sidebarOpen"
      (closeSidebar)="closeSidebar()"
    ></app-sidebar>

    <!-- Conteúdo principal -->
    <div class="lg:ml-64 flex flex-col min-h-screen">
      <!-- Header -->
      <app-header (toggleSidebar)="toggleSidebar()"></app-header>

      <!-- Conteúdo da página -->
      <main class="flex-1 p-4 md:p-6 mt-16">
        <router-outlet></router-outlet>
      </main>
    </div>
  </ng-container>

  <!-- Loading global -->
  <app-loading></app-loading>

  <!-- Toasts globais -->
  <app-toast></app-toast>
</div>
