<div class="fixed top-4 right-4 z-50 flex flex-col gap-2 w-80">
  <div
    *ngFor="let toast of toasts$ | async; trackBy: trackById"
    class="flex items-start gap-3 px-4 py-3 rounded-lg shadow-lg text-sm font-medium cursor-pointer transition-all"
    [ngClass]="{
      'bg-green-50 border border-green-200 text-green-800': toast.type === 'success',
      'bg-red-50 border border-red-200 text-red-800': toast.type === 'error',
      'bg-blue-50 border border-blue-200 text-blue-800': toast.type === 'info'
    }"
    (click)="remove(toast.id)"
  >
    <span class="flex-shrink-0 mt-0.5">
      <svg *ngIf="toast.type === 'success'" class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
      <svg *ngIf="toast.type === 'error'" class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
      <svg *ngIf="toast.type === 'info'" class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M12 2a10 10 0 100 20A10 10 0 0012 2z"/>
      </svg>
    </span>
    <span class="flex-1">{{ toast.message }}</span>
    <button class="flex-shrink-0 opacity-60 hover:opacity-100" (click)="remove(toast.id)">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>
</div>
